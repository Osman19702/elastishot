<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Animated sheet</title>
<style>
  body { margin: 0; font: 16px/1.4 sans-serif; padding: 24px; }
  @keyframes rise { from { transform: translateY(40px); opacity: 0.2; } to { transform: none; opacity: 1; } }
  /* Long enough to still be running when the capture prepares the page. */
  .sheet { animation: rise 4s ease-out forwards; padding: 24px; border: 1px solid #888; width: 320px; }
</style>
</head>
<body>
<main>
  <h1>Sheet</h1>
  <p>A component that finishes its state change when its animation ends.</p>
  <div class="sheet" data-testid="sheet">Content</div>
</main>
<script>
  document.querySelector('.sheet').addEventListener('animationend', () => { document.body.dataset.done = '1' })
</script>
</body>
</html>
