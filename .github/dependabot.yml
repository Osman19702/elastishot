version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch bumps arrive as one weekly pull request; a major bump
    # (opencv.js, TypeScript, Playwright) gets its own, because it needs the
    # engine regression run, not just green checks.
    groups:
      dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
    # @types/node follows the oldest Node the package supports, not the newest
    # release: newer types would let code use APIs that Node 20 and 22 lack.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
