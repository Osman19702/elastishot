name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run check:layering
      - run: npm test
      - run: npm run test:engine
      - run: npm run build
      - run: npm run check:package
      - run: npm run test:browser
      - run: npm run test:acceptance
      - run: npm run test:trace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: elastishot-runs
          path: |
            .elastishot/runs
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
