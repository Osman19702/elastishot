name: Pages

# Builds the landing page in site/ and publishes it to GitHub Pages. The page
# shows real pairs from the UI lab and the version from package.json, so it is
# built from a release tag, with the lab run here instead of committing its
# output. A tag pushed by a person triggers this; the GitHub release the
# Release workflow creates with its own token does not trigger other workflows.
#
# One-time setup: Settings > Pages > Source: GitHub Actions.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: UI lab (pairs, scores and the walkthrough video for the page)
        run: node examples/ui-lab/run-lab.mjs
      - run: node site/build-site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
